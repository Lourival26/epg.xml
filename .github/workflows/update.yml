name: Atualizar EPG Lourival26

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar o script Lourival26
        run: python main.py

      - name: Enviar alterações para o GitHub
        run: |
          git config --global user.name "Lourival26-Bot"
          git config --global user.email "bot@lourival26.com"
          # Adiciona apenas o arquivo completo
          git add epg.completo.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "Automação: EPG completo atualizado"
          git push
